name: Publish Helm Chart

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: publish-helm-chart-${{ github.repository }}
  cancel-in-progress: false

env:
  HELM_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  GOMPLATE_VERSION: "v5.2.0"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Gomplate
        run: |
          curl -fsSL \
            "https://github.com/hairyhenderson/gomplate/releases/download/${GOMPLATE_VERSION}/gomplate_linux-amd64" \
            -o /usr/local/bin/gomplate

          chmod +x /usr/local/bin/gomplate

      - name: Package chart
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}"

          mkdir -p dist

          helm dependency update

          helm package . \
            --version "$VERSION" \
            --destination dist

      - name: Checkout gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

      - name: Generate repository index
        run: |
          cp dist/*.tgz gh-pages/

          if [ -f gh-pages/index.yaml ]; then
            helm repo index gh-pages \
              --url "$HELM_REPO_URL" \
              --merge gh-pages/index.yaml
          else
            helm repo index gh-pages \
              --url "$HELM_REPO_URL"
          fi

      - name: Generate website
        env:
          CHART_VERSION: ${{ github.event.release.tag_name }}
          HELM_REPO_URL: ${{ env.HELM_REPO_URL }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export CHART_NAME="$(helm show chart . | awk '/^name:/ {print $2}')"
          export CHART_DESCRIPTION="$(helm show chart . | sed -n 's/^description: //p')"

          CHART_VERSION="${CHART_VERSION#v}"
          export CHART_VERSION

          gomplate \
            --file .github/templates/helm-chart-index.html.tmpl \
            --out gh-pages/index.html

      - name: Publish
        run: |
          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html index.yaml *.tgz

          git commit \
            -m "chore(release): publish ${GITHUB_REF_NAME}"

          git push origin HEAD:gh-pages
